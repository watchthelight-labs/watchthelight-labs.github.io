# <wtl> project: watchthelight-labs.github.io | file: .github/workflows/deploy.yml | author: watchthelight </wtl>
# Build labs.watchthelight.org from the live repo list and deploy it to GitHub Pages: on every push, every
# 6 hours (new repos, releases and stars show up by themselves), and by hand.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: pillow (link-preview images)
        run: python3 -m pip install --quiet pillow
      - name: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build.py
      - name: check links
        run: python3 tools/check_links.py
      - name: check the site's own text
        run: python3 tools/lint_text.py site.json src/page.html sitegen/render.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
